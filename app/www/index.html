<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PocketCache</title>
    <!-- Offline fallback for the iOS shell: capacitor.config.json names this
         file as server.errorPath, so it shows when https://pocketcache.app/demo/
         cannot load (cold launch with no network). Self-contained on purpose:
         no web fonts or remote assets, since there is no connection. Colors
         mirror the :root tokens in src/index.css. -->
    <style>
      :root {
        --navy: #0B2A4A;
        --teal-logo: #5EEAD4;
        --gold: #FBBF24;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background: var(--navy);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .container { max-width: 320px; }
      .logo { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 16px; }
      .logo .cache { color: var(--teal-logo); }
      .message { font-size: 16px; color: rgba(255,255,255,0.8); margin-bottom: 24px; line-height: 1.5; }
      .link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 24px;
        border-radius: 999px;
        background: var(--gold);
        color: var(--navy);
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
      }
      .link:active { opacity: 0.85; }
      .link:focus-visible { outline: 2px solid var(--teal-logo); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="container">
      <h1 class="logo">Pocket<span class="cache">Cache</span></h1>
      <p class="message">PocketCache needs an internet connection to load.</p>
      <a class="link" href="https://pocketcache.app/demo/">Try again</a>
    </main>
  </body>
</html>
