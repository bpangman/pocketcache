<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PocketCache</title>
<meta name="description" content="PocketCache - round-up giving software for nonprofits." />
<meta property="og:title" content="PocketCache" />
<meta property="og:description" content="PocketCache - round-up giving software for nonprofits." />
<meta property="og:image" content="https://pocketcache.app/logo.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<script>
  // Vanity links: pocketcache.app/BGCA → that org's micro-site, and
  // pocketcache.app/BGCA/give → the giving app itself, pre-bound to the org
  // (that's where a donor lands after "start giving in your browser"  -  the
  // URL is refresh- and bookmark-safe because this forwarder recreates it).
  // GitHub Pages serves this 404 page for any unknown path; anything that
  // doesn't look like a join code falls through to the not-found content.
  // Site words (/about, /legal, /pricing...) are never treated as codes, so a
  // mistyped page shows the not-found card instead of an empty org page.
  // The incoming query string is kept (minus any org/orgpage of its own), so
  // tags like ?src=widget from widget.js survive the hop to /demo/.
  (function () {
    var RESERVED = ['about', 'legal', 'pricing', 'donate', 'login', 'signin', 'signup',
      'help', 'contact', 'blog', 'privacy', 'terms', 'app', 'pitch', 'demo', 'start',
      'donors', 'nonprofits', 'how-it-works', 'assets', 'widget'];
    var parts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/');
    var first = parts[0] || '';
    if (!/^[A-Za-z0-9-]{2,12}$/.test(first) || RESERVED.indexOf(first.toLowerCase()) !== -1) return;
    var key = null;
    if (parts.length === 2 && /^give$/i.test(parts[1])) key = 'org';
    else if (parts.length === 1) key = 'orgpage';
    if (!key) return;
    var params = new URLSearchParams(window.location.search);
    params.delete('org');
    params.delete('orgpage');
    params.set(key, first.toUpperCase());
    window.location.replace('/demo/?' + params.toString() + window.location.hash);
  })();
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
         background: linear-gradient(135deg, #0B2A4A 0%, #003865 100%); color: #fff;
         min-height: 100vh; display: flex; align-items: center; justify-content: center;
         margin: 0; text-align: center; }
  .card { padding: 2rem; max-width: 420px; }
  h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
  p { color: rgba(255,255,255,0.75); font-size: 0.95rem; line-height: 1.6; }
  a { color: #FBBF24; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 3px solid #FBBF24; outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Hmm, that page isn't here.</h1>
    <p>If a nonprofit gave you a link or code, check that it is typed exactly as shared, or head to <a href="/">pocketcache.app</a> to start fresh.</p>
  </div>
</body>
</html>
